<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Misión Ecosistema</title>

<style>
body{
font-family:Arial;
background:linear-gradient(#1b5e20,#66bb6a);
text-align:center;
color:white;
}

.container{
background:white;
color:black;
padding:20px;
border-radius:20px;
max-width:700px;
margin:20px auto;
}

button{
margin:8px;
padding:10px;
border-radius:10px;
background:#2e7d32;
color:white;
border:none;
cursor:pointer;
}

.lock{ opacity:0.4; pointer-events:none; }

#ranking{
margin-top:20px;
background:#f1f8e9;
padding:10px;
border-radius:10px;
}

.pantalla{display:none;}
.activa{display:block;}
</style>
</head>

<body>

<div class="container">

<h1>🌍 MISIÓN: SALVAR EL ECOSISTEMA</h1>

<h3>👥 Selecciona tu equipo</h3>

<button onclick="setEquipo('Lince')">🐾 Lince</button>
<button onclick="setEquipo('Águila')">🦅 Águila</button>
<button onclick="setEquipo('Lobo')">🐺 Lobo</button>

<p>Equipo actual: <b id="equipoActual">-</b></p>

<h3>⭐ Puntos equipo: <span id="puntosEquipo">0</span></h3>

<hr>

<!-- PANTALLAS -->
<div id="inicio" class="pantalla activa">
<button onclick="ir('m1')">🚨 COMENZAR</button>
</div>

<div id="m1" class="pantalla">
<h2>MISIÓN 1</h2>

<button onclick="sumar(5)">Seres vivos</button>
<button onclick="sumar(5)">Agua</button>
<button onclick="sumar(5)">Sol</button>

<input id="r1" placeholder="Define ecosistema">
<button onclick="validar()">Validar</button>

<p id="msg"></p>

<button id="btn2" class="lock" onclick="ir('m2')">🔓 Misión 2</button>
</div>

<div id="m2" class="pantalla">
<h2>MISIÓN 2</h2>

<button onclick="correcto()">Zona óptima</button>
<button onclick="incorrecto()">Zona estrés</button>

<p id="msg2"></p>

<button onclick="ir('m3')">🔓 Misión 3</button>
</div>

<div id="m3" class="pantalla">
<h2>MISIÓN FINAL</h2>
<p>🏆 Ecosistema restaurado</p>
</div>

<hr>

<!-- RANKING -->
<div id="ranking">
<h3>🏆 RANKING</h3>
<ul id="listaRanking"></ul>
</div>

</div>

<script>
let equipos = {
"Lince":0,
"Águila":0,
"Lobo":0
};

let equipoActual = "";

function setEquipo(nombre){
equipoActual = nombre;
document.getElementById("equipoActual").innerText = nombre;
actualizarRanking();
}

function sumar(p){
if(equipoActual=="") return alert("Elige equipo");

equipos[equipoActual]+=p;
actualizar();
}

function validar(){
let r = document.getElementById("r1").value.toLowerCase();

if(r.includes("seres vivos")){
sumar(10);
document.getElementById("msg").innerText="✅ Correcto";
document.getElementById("btn2").classList.remove("lock");
}else{
document.getElementById("msg").innerText="❌ Intenta otra vez";
}
}

function correcto(){
sumar(10);
document.getElementById("msg2").innerText="✅ Bien";
}

function incorrecto(){
document.getElementById("msg2").innerText="❌ No";
}

function actualizar(){
document.getElementById("puntosEquipo").innerText = equipos[equipoActual];
actualizarRanking();
}

function actualizarRanking(){
let lista = document.getElementById("listaRanking");
lista.innerHTML="";

let orden = Object.entries(equipos).sort((a,b)=>b[1]-a[1]);

orden.forEach(e=>{
let li = document.createElement("li");
li.innerText = e[0]+" → "+e[1]+" pts";
lista.appendChild(li);
});
}

function ir(p){
document.querySelectorAll(".pantalla").forEach(x=>x.classList.remove("activa"));
document.getElementById(p).classList.add("activa");
}
</script>

</body>
</html>
