<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Misión Ecosistema</title>

<style>
body{
font-family:Arial;
background:linear-gradient(#1b5e20,#66bb6a);
color:white;
text-align:center;
margin:0;
}

.container{
background:white;
color:black;
padding:20px;
border-radius:20px;
max-width:650px;
margin:30px auto;
box-shadow:0 0 20px rgba(0,0,0,0.3);
}

button{
margin:8px;
padding:10px 15px;
border-radius:10px;
background:#2e7d32;
color:white;
border:none;
cursor:pointer;
}

button:hover{
background:#1b5e20;
}

.pantalla{display:none;}
.activa{display:block;}

#barraCont{
background:#ccc;
border-radius:10px;
margin:15px;
}

#barra{
background:#2e7d32;
width:0%;
color:white;
border-radius:10px;
transition:0.5s;
}

.lock{
opacity:0.4;
pointer-events:none;
}
</style>
</head>

<body>

<div class="container">

<h1>🌍 MISIÓN: SALVAR EL ECOSISTEMA</h1>

<div id="barraCont">
<div id="barra">0%</div>
</div>

<h3>⭐ Puntos: <span id="puntos">0</span></h3>

<!-- INICIO -->
<div id="inicio" class="pantalla activa">
<p>El ecosistema está en peligro…</p>
<button onclick="ir('m1')">🚨 COMENZAR MISIÓN</button>
</div>

<!-- MISIÓN 1 -->
<div id="m1" class="pantalla">
<h2>🚨 MISIÓN 1: ECOSISTEMA</h2>

<p><b>¿Qué es un ecosistema?</b></p>

<button onclick="correcto(10,'msg1','btn2')">
Conjunto de seres vivos, el medio y sus relaciones
</button>

<button onclick="incorrecto('msg1')">
Solo los seres vivos
</button>

<button onclick="incorrecto('msg1')">
Solo el medio físico
</button>

<p id="msg1"></p>

<button id="btn2" class="lock" onclick="ir('m2')">🔓 Siguiente misión</button>
</div>

<!-- MISIÓN 2 -->
<div id="m2" class="pantalla">
<h2>🌡️ MISIÓN 2: FACTORES</h2>

<p><b>¿Dónde vive mejor un ser vivo?</b></p>

<button onclick="correcto(10,'msg2','btn3')">Zona óptima</button>
<button onclick="incorrecto('msg2')">Zona de estrés</button>
<button onclick="incorrecto('msg2')">Zona de intolerancia</button>

<p id="msg2"></p>

<button id="btn3" class="lock" onclick="ir('m3')">🔓 Siguiente misión</button>
</div>

<!-- MISIÓN 3 -->
<div id="m3" class="pantalla">
<h2>🐾 MISIÓN 3: RELACIONES</h2>

<p><b>León → Cebra</b></p>

<button onclick="correcto(10,'msg3','btn4')">Depredación</button>
<button onclick="incorrecto('msg3')">Mutualismo</button>
<button onclick="incorrecto('msg3')">Parasitismo</button>

<p id="msg3"></p>

<button id="btn4" class="lock" onclick="ir('m4')">🔓 Siguiente misión</button>
</div>

<!-- MISIÓN 4 (RAZONAMIENTO) -->
<div id="m4" class="pantalla">
<h2>🧠 MISIÓN FINAL</h2>

<p><b>¿Qué pasaría si desaparecen las plantas?</b></p>

<input id="respuesta" placeholder="Escribe tu respuesta">
<br><br>

<button onclick="validar()">Responder</button>

<p id="msg4"></p>

</div>

</div>

<script>
let puntos = 0;
let progreso = 0;

function ir(p){
document.querySelectorAll(".pantalla").forEach(x=>x.classList.remove("activa"));
document.getElementById(p).classList.add("activa");
}

function correcto(p, msgId, btnId){
document.getElementById(msgId).innerText="✅ Correcto +"+p;
puntos += p;
progreso += 25;

if(btnId){
document.getElementById(btnId).classList.remove("lock");
}

actualizar();
}

function incorrecto(msgId){
document.getElementById(msgId).innerText="❌ Incorrecto";
}

function validar(){
let r = document.getElementById("respuesta").value.toLowerCase();

if(r.includes("mueren") || r.includes("alimento") || r.includes("energía")){
document.getElementById("msg4").innerText="🏆 ¡Excelente! Ecosistema restaurado";
puntos += 20;
progreso = 100;
} else {
document.getElementById("msg4").innerText="💡 Piensa en la cadena trófica";
}

actualizar();
}

function actualizar(){
document.getElementById("puntos").innerText = puntos;
document.getElementById("barra").style.width = progreso + "%";
document.getElementById("barra").innerText = progreso + "%";
}
</script>

</body>
</html>
